{% extends "reset_password_base.html" %}
{% block title %}Set up your account{% endblock %}
{% block main %}
<style>
  h1 { margin-bottom: 1em; }
  label { display: block; margin-top: 1em; }
  input { box-sizing: border-box; width: 100%; margin-top: .4em; }
  button { margin-top: 1em; }
  #success { text-align: left; }
</style>
<h1>Welcome to Gramps Web</h1>
<form id="invitation-form">
  <p>Set up your account for <strong>{{email}}</strong>.</p>
  <label for="full-name">Your name</label>
  <input id="full-name" name="full-name" autocomplete="name" maxlength="255" required>
  <button id="submit" type="submit">Join and sign in</button>
</form>
<p id="error" class="error" role="alert" hidden></p>
<div id="success" class="success" role="status" hidden>
  <p>Your account is ready. Signing you in…</p>
</div>
<script>
  const form = document.getElementById('invitation-form');
  const error = document.getElementById('error');
  const button = document.getElementById('submit');
  const token = new URLSearchParams(window.location.search).get('jwt');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    error.hidden = true;
    button.disabled = true;
    try {
      const response = await fetch(window.location.pathname, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', Authorization: `Bearer ${token}`},
        body: JSON.stringify({
          full_name: document.getElementById('full-name').value.trim(),
        }),
      });
      if (!response.ok) {
        const result = await response.json();
        throw new Error(result.error?.message || result.message || 'Unable to create your account.');
      }
      const result = await response.json();
      const payload = JSON.parse(atob(result.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      localStorage.setItem('access_token', result.access_token);
      localStorage.setItem('access_token_expires', payload.exp * 1000);
      localStorage.setItem('refresh_token', result.refresh_token);
      form.hidden = true;
      document.getElementById('success').hidden = false;
      window.location.replace({{login_url|tojson}});
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    } finally {
      button.disabled = false;
    }
  });
</script>
{% endblock %}
